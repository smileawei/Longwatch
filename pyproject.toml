[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "longwatch"
version = "0.1.0"
description = "Monitor Longbridge portfolio price changes and send Bark alerts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "longbridge>=4.0,<5",
]

[project.scripts]
longwatch = "longwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
longwatch = ["web_assets/*"]
